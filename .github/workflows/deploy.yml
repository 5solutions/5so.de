# Builds the Astro site and uploads it to the Surfer app on Cloudron (www.sobek.info) on every push to main.
# Needs the repository secret SURFER_TOKEN (Surfer admin → Settings → Access Tokens).
name: Deploy to www.sobek.info

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # cloudron-surfer 6.x matches Surfer 6.9 on Cloudron 9.0; after the Cloudron/Surfer 7 update switch to @cloudron/surfer.
      - name: Upload to Surfer
        env:
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
        run: npx -y cloudron-surfer@6.4.1 put --delete --server www.sobek.info --token "$SURFER_TOKEN" dist/* /
