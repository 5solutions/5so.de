# Builds the site and uploads it to the Surfer app on Cloudron (www.sobek.info) – same script as `npm run deploy` locally.
# Manual trigger only for now. To deploy on every push: add the repository secret SURFER_TOKEN
# (Surfer admin → Access Tokens) and add `push: { branches: [main] }` under `on:`.
name: Deploy to www.sobek.info

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
